# Local checks on every push and pull request: LOCAL SIMULATION only (no network, no keys).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install z3 (optional SMT proofs)
        run: pip install --break-system-packages z3-solver==5.3.3.0
      - name: Run every local check
        run: bash thru/run_all_tests.sh
      - name: Keep the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-all-tests-log
          path: thru/build/run_all_tests.log
